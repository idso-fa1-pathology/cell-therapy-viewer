<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7f8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Pathology Viewer</title>
    <script type="module" crossorigin src="/assets/index-6Ul9xQ3m.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BoQbJjiu.css">
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M12 5v14M6 9h3m6 6h3"/></svg></span>
        <div><h1>Pathology Viewer</h1><p>Dual-slide workspace</p></div>
      </div>
      <div class="specimen"><span class="case-label">CASE</span><span id="case-name">Loading case…</span></div>
      <label class="toggle sync-control" title="Link zoom and pan. Re-enabling sync follows the most recently navigated slide."><input id="sync-toggle" type="checkbox" checked disabled /><span class="switch" aria-hidden="true"></span>Sync views</label>
      <button class="reset-button" id="reset-all" disabled><svg aria-hidden="true" viewBox="0 0 20 20"><path d="M4 7a6.5 6.5 0 1 1-.4 5M4 3v4h4"/></svg>Reset views</button>
    </header>
    <main class="workspace" aria-label="Slide comparison">
      <section class="slide-panel" id="he-panel" aria-labelledby="he-title">
        <header class="panel-header">
          <div class="panel-heading">
            <div class="panel-title"><span class="stain-tag he-tag">H&E</span><div><h2 id="he-title">Hematoxylin & eosin</h2><p class="filename" id="he-filename">Loading slide…</p></div></div>
            <label class="toggle"><input id="he-toggle" type="checkbox" checked disabled /><span class="switch" aria-hidden="true"></span>Mask</label>
          </div>
          <div class="panel-tools">
            <label class="opacity-control" for="he-opacity">Opacity <input id="he-opacity" type="range" min="0" max="100" value="40" disabled /><output id="he-opacity-value" for="he-opacity">40%</output></label>
          </div>
        </header>
        <div class="image-stage">
          <div id="he-viewer" class="slide-viewer" aria-label="H&E slide. Drag to pan, scroll to zoom." tabindex="0"></div>
          <div class="loading-state" id="he-loading" role="status"><span class="spinner"></span><span>Opening H&E slide…</span></div>
          <span class="tile-status" id="he-tile-status" role="status"></span>
          <div class="scale-bar"><span id="he-scale-line"></span><span id="he-scale-label"></span></div>
        </div>
        <footer class="panel-footer">
          <span class="image-info" id="he-info">Reading slide…</span>
          <nav class="view-controls" aria-label="H&E navigation">
            <button data-slide="he" data-action="out" aria-label="Zoom out H&E" disabled>−</button>
            <output id="he-zoom" aria-label="H&E image zoom">—</output>
            <button data-slide="he" data-action="in" aria-label="Zoom in H&E" disabled>+</button>
            <span class="control-divider"></span>
            <button data-slide="he" data-action="fit" class="fit-button" aria-label="Fit H&E to screen" disabled><svg aria-hidden="true" viewBox="0 0 20 20"><path d="M7 3H3v4m10-4h4v4M3 13v4h4m10-4v4h-4"/></svg><span>Fit</span></button>
          </nav>
        </footer>
      </section>
      <section class="slide-panel" id="ihc-panel" aria-labelledby="ihc-title">
        <header class="panel-header">
          <div class="panel-heading">
            <div class="panel-title"><span class="stain-tag ihc-tag">IHC</span><div><h2 id="ihc-title">Immunohistochemistry</h2><p class="filename" id="ihc-filename">Loading slide…</p></div></div>
            <label class="toggle"><input id="ihc-toggle" type="checkbox" checked disabled /><span class="switch" aria-hidden="true"></span>Annotations</label>
          </div>
          <div class="panel-tools">
            <label class="opacity-control" for="ihc-opacity">Opacity <input id="ihc-opacity" type="range" min="0" max="100" value="75" disabled /><output id="ihc-opacity-value" for="ihc-opacity">75%</output></label>
            <div class="annotation-legend" id="annotation-legend" role="group" aria-label="Annotation appearance" hidden>
              <div class="annotation-colors" id="annotation-colors"></div>
              <div class="annotation-size-row">
                <label class="size-control" for="annotation-size">Size <input id="annotation-size" type="range" min="50" max="300" step="25" value="100" aria-label="Annotation point size" /><output id="annotation-size-value" for="annotation-size">1×</output></label>
                <button class="reset-style" id="reset-annotation-style" aria-label="Reset style" title="Reset style: restore the GeoJSON colors and default point size" disabled><svg aria-hidden="true" viewBox="0 0 20 20"><path d="M4 7a6.5 6.5 0 1 1-.4 5M4 3v4h4"/></svg></button>
              </div>
            </div>
          </div>
        </header>
        <div class="image-stage">
          <div id="ihc-viewer" class="slide-viewer" aria-label="IHC slide. Drag to pan, scroll to zoom." tabindex="0"></div>
          <div class="loading-state" id="ihc-loading" role="status"><span class="spinner"></span><span>Opening IHC slide…</span></div>
          <span class="tile-status" id="ihc-tile-status" role="status"></span>
          <div class="scale-bar"><span id="ihc-scale-line"></span><span id="ihc-scale-label"></span></div>
        </div>
        <footer class="panel-footer">
          <span class="image-info" id="ihc-info">Reading slide…</span>
          <nav class="view-controls" aria-label="IHC navigation">
            <button data-slide="ihc" data-action="out" aria-label="Zoom out IHC" disabled>−</button>
            <output id="ihc-zoom" aria-label="IHC image zoom">—</output>
            <button data-slide="ihc" data-action="in" aria-label="Zoom in IHC" disabled>+</button>
            <span class="control-divider"></span>
            <button data-slide="ihc" data-action="fit" class="fit-button" aria-label="Fit IHC to screen" disabled><svg aria-hidden="true" viewBox="0 0 20 20"><path d="M7 3H3v4m10-4h4v4M3 13v4h4m10-4v4h-4"/></svg><span>Fit</span></button>
          </nav>
        </footer>
      </section>
    </main>
    <footer class="app-footer">
      <span class="gesture-hint">Scroll to zoom <span>·</span> Drag to pan <span>·</span> <span id="navigation-mode">Synced views</span></span>
      <span id="annotation-status" role="status">Preparing annotations…</span>
    </footer>
  </body>
</html>
