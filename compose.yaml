x-proxy: &proxy
  # Set VIEWER_PROXY= in .env to disable the proxy outside this network.
  HTTP_PROXY: ${VIEWER_PROXY-http://1mcwebproxy01.mdanderson.edu:3128}
  HTTPS_PROXY: ${VIEWER_PROXY-http://1mcwebproxy01.mdanderson.edu:3128}
  http_proxy: ${VIEWER_PROXY-http://1mcwebproxy01.mdanderson.edu:3128}
  https_proxy: ${VIEWER_PROXY-http://1mcwebproxy01.mdanderson.edu:3128}
  NO_PROXY: localhost,127.0.0.1,::1
  no_proxy: localhost,127.0.0.1,::1

services:
  viewer:
    image: ${VIEWER_IMAGE:-pathology-viewer:local}
    build:
      context: .
      args: *proxy
    init: true
    restart: unless-stopped
    ports:
      - "${VIEWER_BIND_ADDRESS:-0.0.0.0}:${VIEWER_PORT:-8000}:8000"
    environment:
      <<: *proxy
      VIEWER_HOST: 0.0.0.0
      VIEWER_PORT: "8000"
      DATA_DIR: /data
      DATA_LAYOUT: ${DATA_LAYOUT:-case}
      CACHE_DIR: /cache
      MAX_OPEN_CASES: ${MAX_OPEN_CASES:-4}
      # Relative to every case folder; "." keeps files directly in the case.
      HE_SLIDE_SUBDIR: ${HE_SLIDE_SUBDIR:-.}
      IHC_SLIDE_SUBDIR: ${IHC_SLIDE_SUBDIR:-.}
      HE_MASK_SUBDIR: ${HE_MASK_SUBDIR:-.}
      IHC_ANNOTATIONS_SUBDIR: ${IHC_ANNOTATIONS_SUBDIR:-.}
      # Exact paths within each case (case layout) or cohort (cohort layout).
      # {slide} is the last part of the case URL.
      # A nonempty PATH overrides the corresponding SUBDIR/suffix search.
      HE_SLIDE_PATH: ${HE_SLIDE_PATH:-}
      IHC_SLIDE_PATH: ${IHC_SLIDE_PATH:-}
      HE_MASK_PATH: ${HE_MASK_PATH:-}
      IHC_ANNOTATIONS_PATH: ${IHC_ANNOTATIONS_PATH:-}
    volumes:
      - type: bind
        source: ${DATA_DIR:-./data}
        target: /data
        read_only: true
        bind:
          create_host_path: false
      - viewer-cache:/cache

volumes:
  viewer-cache:
